# Configuration file used to collect benchmarking in MET tools using CTRACK
#


#
# filename
# Timestamp in ISO 1806 format is used to generate output filename
# If filename setting is empty string, then timestamp is used.
# Otherwise, the specified filename followed by the timestamp will
# be used for the output filename.
#
filename: ''

#
# Output directory where output files will be saved
#
benchmark_output_path: !ENV '${BENCHMARK_OUTPUT_BASE}/usecase'

#
# location of METplus
#
metplus_base: !ENV '${METPLUS_BASE}'

#
# location of system.conf file
#
system_conf: "/d1/personal/mwin/AF_optimization/MET/internal/scripts/benchmark/system.conf"

#
# location of METplus wrapper configuration file(s)
#
wrapper_conf: 
   - "/d1/personal/mwin/AF_optimization/usecase_confs/truncated/EnsembleStat_fcstRRFS_obsCCPA_1hrAPCP_truncated.conf"

#
# run MET command instead of using METplus
#
run_met_directly: False
met_command: '/d1/personal/mwin/AF_optimization/MET/bin/ensemble_stat -v 2 /d1/personal/mwin/AF_optimization/save_stage/file_lists.20250130003727/20220501000000_24_ensemble_stat.txt /d1/personal/mwin/AF_optimization/METplus/metplus/parm/met_config/EnsembleStatConfig_wrapped -grid_obs /d1/projects/AF/obs/ccpa/20220502/ccpa.t00z.01h.hrap.conus.gb2 -outdir /d1/personal/mwin/AF_optimization/output/truncated/MET_output/ensemble_stat_grid/202205010000' 

# subdirectory to save the consolidated information, if empty, the
# MET tool name will be used
met_subdir_name: 'EnsembleStat_fcstRRFS_obsCCPA_1hrAPCP'



#
# number of times to run the use case, default=1
#
num_runs: 3




