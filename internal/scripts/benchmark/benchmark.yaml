# Configuration file used to collect benchmarking in MET tools using CTRACK
#


#
# filename
# Timestamp in ISO 1806 format is used to generate output filename
# If filename setting is empty string, then timestamp is used.
# Otherwise, the specified filename followed by the timestamp will
# be used for the output filename.
#
filename: ''

#
# Output directory where output files will be saved
#
output_path: !ENV '${OUTPUT_BASE}'

#
# location of METplus
#
metplus_base: !ENV '${METPLUS_BASE}'

#
# location of system.conf file
#
system_conf: "/d1/personal/mwin/AF_optimization/system.conf"

#
# location of METplus wrapper configuration file
#
wrapper_conf: 
   - "/d1/personal/mwin/AF_optimization/grid_stat/GridStat_fcstRRFS_obsCCPA_1hrAPCP.conf"
   - "/d1/personal/mwin/AF_optimization/grid_stat/GridStat_fcstRRFS_obsCCPA_1hrAPCP_nbhrd.conf"
   - "/d1/personal/mwin/AF_optimization/grid_stat/GridStat_fcstRRFS_obsCCPA_1hrAPCP_prob.conf"
   - "/d1/personal/mwin/AF_optimization/grid_stat/GridStat_fcstRRFS_obsCCPA_1hrAPCP_prob.conf"
   - "/d1/personal/mwin/AF_optimization/point_stat/PointStat_fcstRRFS_obsNDAS_TMP.conf"
   - "/d1/personal/mwin/AF_optimization/point_stat/PointStat_fcstRRFS_obsNDAS_TMP_prob.conf"
   - "/d1/personal/mwin/AF_optimization/ensemble_stat/EnsembleStat_fcstRRFS_obsCCPA_1hrAPCP.conf"
   - "/d1/personal/mwin/AF_optimization/ensemble_stat/EnsembleStat_fcstRRFS_obsNDAS_TMP.conf"
  

#
# number of times to run the use case, default=1
#
num_runs: 2




