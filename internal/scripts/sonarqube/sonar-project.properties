# Project and source code settings
sonar.projectKey=MET
sonar.projectName=MET
sonar.projectVersion=SONAR_PROJECT_VERSION
sonar.branch.name=SONAR_BRANCH_NAME
sonar.sources=src,scripts/python,data/wrappers
sonar.python.version=3.6.3
sonar.sourceEncoding=UTF-8

# Path to the compile_commands.json generated by build-wrapper
sonar.cfamily.compile-commands=bw-outputs/compile_commands.json

# SonarQube server
sonar.host.url=SONAR_HOST_URL
sonar.token=SONAR_TOKEN
