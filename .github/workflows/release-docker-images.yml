name: Create Release Docker Images

on:

  push:
    tags:
      - v*

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Comma-separated list of versions to build, e.g. v12.1,v12.2'
        default: 'v12.1,v12.2'
        required: true
        type: string
      update_latest:
        description: 'Update "X.Y" and "X.Y-latest" images.'
        default: false
        required: true
        type: boolean

  schedule:
    - cron: "35 03 * * 0"

env:
  DOCKERHUB_REPO: dtcenter/met

jobs:

  define-matrix:
    name: Define Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-versions.outputs.matrix }}
      update_latest: ${{ steps.get-versions.outputs.update_latest }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'dtcenter/metplus'
          ref: 'develop'
          sparse-checkout: metplus/component_versions.py
          sparse-checkout-cone-mode: false

      - name: Get versions to build 
        id: get-versions
        run: |
          if [[ ${{ github.event_name }} == 'schedule' ]]; then
            version_string="v12.1,v12.2"
            update_latest="true"
          elif [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            version_string=${{ toJSON(inputs.release_version) }}
            update_latest=${{ toJSON(inputs.update_latest) }}
          else
            version_string=${{ toJSON(github.ref_name) }}
            update_latest="true"
          fi
          IFS=',' read -r -a version_array <<< "${version_string}"
          matrix="{\"version\": ["
          for version in "${version_array[@]}"; do
            if [[ ${version} =~ ^v[0-9]+.[0-9]+$ ]]; then
              matrix+=\"$(${GITHUB_WORKSPACE}/metplus/component_versions.py -v ${version} -i MET -o MET)\",
            else
              matrix+=\"${version}\",
            fi
          done
          matrix+="]}"
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo "update_latest=${update_latest}" >> $GITHUB_OUTPUT

  build_scan_and_push:
    name: Build, Scan, and Push Images
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - name: Free Disk Space
        uses: dtcenter/metplus-action-free-disk-space@v1

      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.version }}
          path: ${{ matrix.version }}
          sparse-checkout: |
            internal/scripts/docker/Dockerfile
            .github/jobs/get_met_base_image.sh
          sparse-checkout-cone-mode: false

      - name: Get MET base image
        id: get_met_base_image
        run: |
          # Read the METbaseimage version from the release being built, not from
          # the default branch, so that rebuilding an older release still uses the
          # base image that release was built against. Releases created before the
          # script existed have no get_met_base_image.sh, so leave the outputs
          # empty and let the defaults in that release's Dockerfile apply. Confirm
          # that those defaults actually exist rather than assuming they do, since
          # an empty tag fails the build later with an unexplained
          # "invalid reference format".
          script=${GITHUB_WORKSPACE}/${SOURCE_BRANCH}/.github/jobs/get_met_base_image.sh
          dockerfile=${GITHUB_WORKSPACE}/${SOURCE_BRANCH}/internal/scripts/docker/Dockerfile
          if [[ -f ${script} ]]; then
            ${script}
          elif [[ ! -f ${dockerfile} ]]; then
            echo "ERROR: Neither of these exists:"
            echo "ERROR:   ${script}"
            echo "ERROR:   ${dockerfile}"
            echo "ERROR: Check that ${SOURCE_BRANCH} names an existing tag or branch"
            echo "ERROR: and that the sparse checkout patterns above still match."
            exit 1
          elif grep -q '^ARG MET_BASE_TAG=.' ${dockerfile}; then
            echo "${script} does not exist"
            echo "Using the METbaseimage defaults from the ${SOURCE_BRANCH} Dockerfile:"
            grep '^ARG MET_BASE_' ${dockerfile}
          else
            echo "ERROR: The METbaseimage version for ${SOURCE_BRANCH} cannot be"
            echo "ERROR: determined because this script does not exist:"
            echo "ERROR:   ${script}"
            echo "ERROR: and this Dockerfile defines no default MET_BASE_TAG:"
            echo "ERROR:   ${dockerfile}"
            exit 1
          fi
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Create directories to store build log output
        run: mkdir -p ${RUNNER_WORKSPACE}/logs

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          .github/jobs/build_docker_image.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}
          MET_CONFIG_OPTS: '--enable-all'
          MET_BASE_REPO: ${{ steps.get_met_base_image.outputs.met_base_repo }}
          MET_BASE_TAG: ${{ steps.get_met_base_image.outputs.met_base_tag }}

      - name: Copy build log files into logs directory
        if: always()
        run: |
          cp ${GITHUB_WORKSPACE}/*.log ${RUNNER_WORKSPACE}/logs/

      - name: Upload build logs as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build_logs_${{ matrix.version }}
          path: ${{ runner.workspace }}/logs
          if-no-files-found: ignore

      - name: Get DockerHub tag
        id: get-dockerhub-tag
        run: |
          source ${GITHUB_WORKSPACE}/.github/jobs/bash_functions.sh
          DOCKERHUB_TAG=$(get_dockerhub_tag)
          echo "DOCKERHUB_TAG=${DOCKERHUB_TAG}" >> $GITHUB_OUTPUT
        env:
          SOURCE_BRANCH: ${{ matrix.version }}

      - name: Scan Docker Images
        id: security-scan
        continue-on-error: false
        uses: dtcenter/metplus-action-scan-docker-images@v2
        with:
          images: |
            [
              "${{ steps.get-dockerhub-tag.outputs.DOCKERHUB_TAG }}"
            ]
          fail-on-critical: "false"
          log-artifact-name: 'security-scan-logs_${{ matrix.version }}'

      - name: Push Docker Image
        run: |
          .github/jobs/push_docker_image.sh
        env:
          SOURCE_BRANCH: ${{ matrix.version }}
          UPDATE_LATEST: ${{ fromJSON(needs.define-matrix.outputs.update_latest) }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}
