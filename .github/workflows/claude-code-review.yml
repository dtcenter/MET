name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    # Skip the automated "Update <branch>-ref after #NNNN" sync pull
    # requests, which are bot-authored merges of accumulated history
    # rather than code written for review.
    branches-ignore:
      - '*-ref'

  # Manual re-review. GitHub restricts workflow_dispatch to users with
  # write access to the repository, so no additional guard is needed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Review once when a pull request is opened or marked ready for
    # review. Re-review on demand by applying the "claude-review" label
    # (remove and re-add it to trigger again) or from the Actions tab.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'claude-review'))

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --max-turns 50'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
