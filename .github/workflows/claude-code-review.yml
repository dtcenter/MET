name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    # Skip the automated "Update <branch>-ref after #NNNN" sync pull
    # requests, which are bot-authored merges of accumulated history
    # rather than code written for review.
    branches-ignore:
      - '*-ref'

  # Manual re-review. GitHub restricts workflow_dispatch to users with
  # write access to the repository, so no additional guard is needed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Review once when a pull request is opened or marked ready for
    # review. Re-review on demand by applying the "claude-review" label
    # (remove and re-add it to trigger again) or from the Actions tab.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'claude-review'))

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Write access is required to post the review: the inline comments on
      # the diff and the single top-level summary comment in the pull request
      # conversation. Nothing else in the repository is written.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so the reviewer can diff against the base branch and
          # read the history of the files the pull request touches.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /code-review high ${{ github.event.pull_request.number || inputs.pr_number }} --comment --max-findings all

            The effort level is the first argument, before the pull request
            number, and controls how much the review reports: "low" returns
            only a few high-confidence findings, while "high" returns more,
            including some the reviewer is less certain about. Raise it to
            "xhigh" for a release branch if a deeper pass is wanted.

            Always finish by posting exactly one top-level summary comment on
            the pull request with `gh pr comment`, whether or not any issues
            were found, and post it after any inline comments. That comment
            contains these sections, in this order:

            1. Two or three sentences describing what this pull request
               changes, in your own words rather than quoting the description.
            2. The findings, one per line, each naming the file and line the
               inline comment was posted on, so the conversation shows at a
               glance what the review flagged. Say so plainly when there are
               none.
            3. "Project conventions", judging the pull request against
               CLAUDE.md in the root of this repository: whether the release
               notes carry an entry for this issue under the current version,
               whether the upgrade instructions needed updating, whether the
               documentation changed when user-visible behavior did, whether
               the unit tests were updated, and the files this pull request
               adds, renames, or removes.
            4. "Questions for the author", listing anything the diff alone
               could not settle. Leave the section out when there is nothing
               to ask.

            Report only what the diff and the repository support. Do not pad
            the summary to fill a section.
          # The tools the review needs: the inline comment tool, the
          # read-only gh commands that read the pull request, `gh pr comment`
          # for the summary, and the read-only git commands that give it the
          # history of the files in the diff. Read, Grep, and Glob let it read
          # the checked-out source rather than working from the diff alone,
          # which is what lets it judge a change against the code calling it.
          # Task and ReportFindings are how the review fans out to its
          # reviewer subagents and reports what they confirm.
          # Note that the action runs in auto permission mode, where this list
          # is an allow rule rather than a strict whitelist; other tool calls
          # are decided by the action's own safety review.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Task,ReportFindings,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --max-turns 80
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
